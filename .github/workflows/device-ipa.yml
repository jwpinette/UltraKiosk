# UltraKiosk -> unsigned .ipa for a real iPad (2026-11-06; voice reworked 2026-11-07).
# Goes in JP's fork at .github/workflows/device-ipa.yml. Run it from the Actions tab ("Run workflow").
# The upstream repo only builds for the simulator (can't be installed on a device). This workflow:
#   1. patches the hidden settings hot-spot, 2. builds for iphoneos without signing,
#   3. zips Payload/ into UltraKiosk-unsigned.ipa and uploads it as a downloadable artifact.
# VOICE (11-07): the fork's UltraKiosk/Managers/AudioManager.swift is REPLACED by homeserver-configs/ultrakiosk/
# AudioManager.swift - the wake word ("Eden") now runs on the server in HA's Assist pipeline, no Porcupine.
# Signing happens on JP's Windows PC with Sideloadly (his Apple ID), which re-signs the whole bundle.
name: Device IPA (unsigned, server-side Eden wake word)
on:
  workflow_dispatch:
  push:                    # 11-07: every push to main builds the IPA (Claude pushes via a repo-only deploy key)
    branches: [main]
    paths: ['UltraKiosk/**', '.github/workflows/device-ipa.yml']
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check the server-side voice AudioManager is in place
        run: grep -q "AssistPipelineClient" UltraKiosk/Managers/AudioManager.swift || { echo "Upload homeserver-configs/ultrakiosk/AudioManager.swift to UltraKiosk/Managers/ first"; exit 1; }
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app
      - name: Settings hot-spot - invisible, smaller, BOTTOM-RIGHT corner (triple-tap there)
        run: |
          F=UltraKiosk/ContentView.swift
          # 1. invisible but still tappable: the gray square's opacity 0.1 -> 0.001 (same trick the app uses elsewhere)
          perl -0pi -e 's/(\.fill\(Color\.gray\)\s*\.cornerRadius\(25\)\s*)\.opacity\(0\.1\)/${1}.opacity(0.001)/' $F
          # 2. smaller: 50x50 -> 30x30 so it doesn't cover anything (JP 11-07)
          perl -0pi -e 's/(\.opacity\(0\.001\)\s*)\.frame\(width: 50, height: 50\)/${1}.frame(width: 30, height: 30)/' $F
          # 3. bottom-right: top-right sat on HA's Assist button, top-left on the Home tab. Move the VStack's trailing
          #    Spacer() to BEFORE the HStack (HStack keeps Spacer-then-Rectangle = right side).
          perl -0pi -e 's/(\/\/ Settings Access[^\n]*\n\s*VStack \{)(\s*HStack \{.*?onTapGesture\(count: 3\).*?\}\s*\})\s*Spacer\(\)/$1\n                Spacer()$2/s' $F
          sed -n '/Settings Access/,/^            }/p' $F | head -16
          grep -q 'opacity(0.001)' $F && grep -q 'width: 30, height: 30' $F || { echo "hot-spot patch failed - upstream changed"; exit 1; }
      - name: Build for device (no signing)
        run: |
          xcodebuild build \
            -project UltraKiosk.xcodeproj -scheme UltraKiosk \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO OTHER_SWIFT_FLAGS="-D ED_SKIP_SWIFT_FORMAT"
      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr UltraKiosk-unsigned.ipa Payload
          ls -la UltraKiosk-unsigned.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: UltraKiosk-unsigned-ipa
          path: UltraKiosk-unsigned.ipa
          retention-days: 7
